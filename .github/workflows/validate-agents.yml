name: Valider les sous-agents

# Déclenche à chaque push et pull request touchant les agents,
# le validateur ou le workflow lui-même.
on:
  push:
    paths:
      - '.claude/agents/**'
      - 'scripts/validate-agents.mjs'
      - 'scripts/run-evals.mjs'
      - 'evals/**'
      - '.github/workflows/validate-agents.yml'
  pull_request:
    paths:
      - '.claude/agents/**'
      - 'scripts/validate-agents.mjs'
      - 'scripts/run-evals.mjs'
      - 'evals/**'
      - '.github/workflows/validate-agents.yml'

jobs:
  validate:
    name: Validation statique
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Valider les sous-agents
        run: node scripts/validate-agents.mjs

      - name: Valider les cas d'éval (schéma + couverture)
        run: node scripts/run-evals.mjs --check
